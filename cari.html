<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cari Produk - TokoKu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
  <meta name="theme-color" content="#0c8377">
  <link rel="icon" type="image/svg+xml" href="img/logo-ikon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/modern.css" rel="stylesheet">
  <script>try{var t=localStorage.getItem("tokoku_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-bs-theme",t)}catch(e){}</script>
</head>
<body data-page="cari">
  <div id="navbar"></div>

  <main class="container my-4 page-fade">
    <nav class="search-category-filter mb-3" aria-label="Kategori produk">
      <button type="button" class="btn btn-sm btn-outline-primary active" data-category="Semua" aria-pressed="true">Semua</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-category="Fashion" aria-pressed="false">Fashion</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-category="Elektronik" aria-pressed="false">Elektronik</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-category="Rumah Tangga" aria-pressed="false">Rumah Tangga</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-category="Olahraga" aria-pressed="false">Olahraga</button>
    </nav>
    <p class="text-muted mb-3" id="resultInfo" aria-live="polite"></p>

    <section>
      <div class="row g-4" id="productGrid"></div>
      <div class="text-center py-5 d-none" id="emptyState">
        <i class="bi bi-emoji-frown display-3 text-muted"></i>
        <h5 class="mt-3">Produk tidak ditemukan</h5>
        <p class="text-muted">Coba kata kunci lain, misalnya nama kategori seperti Fashion atau Elektronik.</p>
        <button class="btn btn-primary" id="resetButton" type="button">Tampilkan Semua Produk</button>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cari.js"></script>
</body>
</html>
