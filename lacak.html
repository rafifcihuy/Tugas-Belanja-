<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lacak Pesanan - TokoKu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
  <link href="css/lacak.css" rel="stylesheet">
    <meta name="theme-color" content="#0c8377">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/modern.css" rel="stylesheet">
  <script>try{var t=localStorage.getItem("tokoku_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-bs-theme",t)}catch(e){}</script>
</head>
<body data-page="lacak">
  <div id="navbar"></div>

  <main class="container my-4 page-fade">
    <h4 class="fw-bold mb-1">Lacak Pesanan</h4>
    <p class="text-muted">Pantau status pesanan Anda. Halaman ini diperbarui otomatis setiap 5 detik.</p>

    <form id="trackForm" class="input-group mb-4 track-search">
      <span class="input-group-text bg-white"><i class="bi bi-upc-scan"></i></span>
      <input type="text" class="form-control" id="trackInput" placeholder="Masukkan nomor pesanan, contoh: TK12345678" aria-label="Nomor pesanan">
      <button class="btn btn-primary" type="submit">Lacak</button>
    </form>

    <div class="row g-4">
      <div class="col-lg-4">
        <div id="orderList"></div>
      </div>
      <div class="col-lg-8">
        <div id="trackDetail" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pesanan.js"></script>
  <script src="js/lacak.js"></script>
</body>
</html>
