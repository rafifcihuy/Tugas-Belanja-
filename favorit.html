<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk Favorit - Nekoyo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
  <meta name="theme-color" content="#C2417A">
  <link rel="icon" type="image/svg+xml" href="img/logo-ikon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/modern.css" rel="stylesheet">
  <script>try{var t=localStorage.getItem("tokoku_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-bs-theme",t)}catch(e){}</script>
</head>
<body data-page="favorit">
  <div id="navbar"></div>

  <main class="container my-4 page-fade">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1"><i class="bi bi-heart-fill me-2 text-brand"></i>Produk Favorit</h1>
        <p class="text-muted mb-0">Kumpulan produk yang Anda simpan untuk nanti.</p>
      </div>
      <a href="index.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left me-1"></i>Jelajahi Produk</a>
    </div>

    <section aria-label="Daftar produk favorit">
      <div class="row g-4" id="favoriteGrid"></div>
      <div class="text-center py-5 d-none" id="favoriteEmptyState">
        <i class="bi bi-heart display-3 text-muted"></i>
        <h5 class="mt-3">Belum ada produk favorit</h5>
        <p class="text-muted">Tekan ikon hati pada produk untuk menyimpannya di sini.</p>
        <a href="index.html" class="btn btn-primary">Jelajahi Produk</a>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/favorit.js"></script>
</body>
</html>
