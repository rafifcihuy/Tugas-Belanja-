<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk Favorit - Nekoyo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
  <meta name="theme-color" content="#C2417A">
  <link rel="icon" type="image/svg+xml" href="img/logo-ikon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/modern.css" rel="stylesheet">
  <link href="css/favorit.css" rel="stylesheet">
  <script>try{var t=localStorage.getItem("tokoku_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-bs-theme",t)}catch(e){}</script>
</head>
<body data-page="favorit">
  <div id="navbar"></div>

  <main class="container my-4 page-fade">
    <div class="fav-header">
      <div class="fav-title">
        <span class="fav-tile"><i class="bi bi-heart-fill"></i></span>
        <div>
          <h1 class="h4 fw-bold mb-0">Favorit Saya</h1>
          <small class="text-muted" id="favCount">Belum ada yang disimpan</small>
        </div>
      </div>
      <button type="button" class="btn btn-primary fav-add-all" id="addAllButton" hidden>
        <i class="bi bi-cart-plus me-1"></i>Tambah semua ke keranjang
      </button>
    </div>

    <section aria-label="Daftar produk favorit">
      <div class="row g-3 g-md-4" id="favoriteGrid"></div>
      <div class="text-center py-5 d-none" id="favoriteEmptyState">
        <img class="empty-state-image" src="img/1.png" alt="Ilustrasi belum ada produk favorit">
        <h5 class="mt-3">Hatinya masih kosong~</h5>
        <p class="text-muted">Tekan ikon hati pada produk yang kamu suka, nanti aku simpenin di sini ya!</p>
        <a href="index.html" class="btn btn-primary">Cari yang aku suka</a>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/favorit.js"></script>
</body>
</html>
